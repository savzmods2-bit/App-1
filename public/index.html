<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Network | Sleek Unblocked</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1 class="logo">PHOENIX</h1>
            <p class="subtitle">Access the web without limits.</p>
        </header>

        <main>
            <form id="uv-form">
                <div class="search-wrapper">
                    <input id="uv-address" type="text" placeholder="Enter URL or search..." autocomplete="off">
                </div>
            </form>
            
            <div class="quick-links">
                <a href="#" onclick="launch('https://www.youtube.com')">YouTube</a>
                <a href="#" onclick="launch('https://www.google.com')">Google</a>
                <a href="#" onclick="launch('https://discord.com')">Discord</a>
                <a href="#" onclick="launch('https://roblox.com')">Roblox</a>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Phoenix Network</p>
        </footer>
    </div>

    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <script src="index.js" defer></script>

</body>
</html>
